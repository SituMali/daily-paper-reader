subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: dep-support
      description: 请帮我查找并持续追踪有关老年抑郁非典型症状（认知衰退、睡眠障碍、运动迟缓、躯体症状、躯体衰弱等）相关文献、老年人社会支持相关研究文献以及社会支持与老年抑郁非典型症状间关联的相关文献，如果有网络分析的研究更好
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: late-life depression
          keyword_cn: 老年抑郁症
          query: depressive disorder in older adults with atypical features
        - keyword: atypical depression symptoms
          keyword_cn: 非典型抑郁症状
          query: non-typical depressive manifestations including cognitive, sleep, motor, somatic, and frailty signs
        - keyword: cognitive decline
          keyword_cn: 认知衰退
          query: cognitive impairment or decline associated with geriatric depression
        - keyword: somatic symptoms
          keyword_cn: 躯体症状
          query: physical pain and somatic complaints in older adults with depression
        - keyword: social support depression
          keyword_cn: 社会支持与抑郁
          query: social support as a protective factor against depression in late life
        - keyword: network analysis
          keyword_cn: 网络分析
          query: network approach to analyzing symptom-level associations in psychopathology
      intent_queries:
        - query: >-
            investigate atypical symptoms of late life depression including cognitive decline, sleep disturbance,
            psychomotor retardation, somatic symptoms, and physical frailty
          query_cn: 调查老年抑郁症的非典型症状，包括认知衰退、睡眠障碍、精神运动性迟缓、躯体症状和躯体衰弱
          enabled: true
          source: manual
          note: ''
        - query: explore the association between social support and depressive symptoms in elderly populations
          query_cn: 探讨老年人社会支持与抑郁症状之间的关联
          enabled: true
          source: manual
          note: ''
        - query: >-
            identify network analysis studies that examine relationships between social support and atypical depressive
            symptoms in late life
          query_cn: 识别考察晚年社会支持与非典型抑郁症状关系的网络分析研究
          enabled: true
          source: manual
          note: ''
